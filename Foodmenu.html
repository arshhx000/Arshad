<!DOCTYPE html>
<html lang="en" class="h-full dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hostel & Class Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            te: {
              bg: '#EBE9E1',
              darkbg: '#141416',
              panel: '#F4F2EC',
              darkpanel: '#1E1E22',
              orange: '#FF4E00',
              yellow: '#FFC700',
              green: '#00D66C',
              blue: '#007AFF',
              darkText: '#18181A',
              lightText: '#EEEEF0',
              gray: '#8E8E93',
              glass: 'rgba(255, 255, 255, 0.55)',
              glassDark: 'rgba(30, 30, 34, 0.70)'
            }
          },
          fontFamily: {
            mono: ['"Space Mono"', 'monospace'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          },
          boxShadow: {
            'te-btn': '0px 3px 0px 0px rgba(0, 0, 0, 0.15), inset 0px 1px 0px 0px rgba(255,255,255,0.6)',
            'te-card': '0 8px 32px 0 rgba(0, 0, 0, 0.06), inset 0 1px 1px 0 rgba(255, 255, 255, 0.6)',
            'te-card-dark': '0 8px 32px 0 rgba(0, 0, 0, 0.37), inset 0 1px 1px 0 rgba(255, 255, 255, 0.1)',
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(142, 142, 147, 0.4); border-radius: 99px; }
    
    .glass-effect {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .tactile-btn {
      transition: all 0.08s cubic-bezier(0.2, 0, 0, 1);
    }
    .tactile-btn:active {
      transform: translateY(2px);
    }
  </style>
</head>

<body class="bg-te-darkbg text-te-lightText font-sans min-h-full transition-colors duration-200 antialiased select-none pb-16">

  <main class="max-w-5xl mx-auto px-4 pt-6 space-y-6">

    <!-- MODE TOGGLE SWITCH (MESS MENU vs CLASS TIMETABLE) -->
    <section class="space-y-2">
      <div class="grid grid-cols-2 gap-2 p-1.5 rounded-2xl bg-te-darkpanel border border-white/10 shadow-lg">
        <button id="tab-mess" onclick="switchView('mess')" class="tactile-btn py-2.5 rounded-xl font-mono text-xs font-bold transition flex items-center justify-center gap-2 bg-te-orange text-white shadow-md">
          <i data-lucide="utensils" class="w-4 h-4"></i>
          <span>MESS MENU</span>
        </button>
        <button id="tab-timetable" onclick="switchView('timetable')" class="tactile-btn py-2.5 rounded-xl font-mono text-xs font-bold transition flex items-center justify-center gap-2 text-te-gray hover:text-white">
          <i data-lucide="graduation-cap" class="w-4 h-4"></i>
          <span>CLASS TIMETABLE</span>
        </button>
      </div>
    </section>

    <!-- DAY SELECTOR STRIP -->
    <section class="space-y-2.5">
      <div class="flex items-center justify-between px-1">
        <span class="font-mono text-xs font-bold text-te-gray uppercase tracking-wider flex items-center gap-1.5">
          <i data-lucide="calendar" class="w-3.5 h-3.5 text-te-orange"></i> SELECT DAY
        </span>
        <button onclick="selectToday(true)" class="font-mono text-[11px] font-bold text-te-orange hover:underline flex items-center gap-1">
          <i data-lucide="rotate-ccw" class="w-3 h-3"></i> TODAY
        </button>
      </div>

      <div class="grid grid-cols-7 gap-1.5 sm:gap-2">
        <button onclick="setDay('Monday')" class="day-btn tactile-btn py-3 rounded-2xl font-mono text-xs font-bold border border-white/10 bg-te-darkpanel flex flex-col items-center justify-center transition" data-day="Monday">
          <span class="text-[10px] opacity-60">MON</span>
        </button>
        <button onclick="setDay('Tuesday')" class="day-btn tactile-btn py-3 rounded-2xl font-mono text-xs font-bold border border-white/10 bg-te-darkpanel flex flex-col items-center justify-center transition" data-day="Tuesday">
          <span class="text-[10px] opacity-60">TUE</span>
        </button>
        <button onclick="setDay('Wednesday')" class="day-btn tactile-btn py-3 rounded-2xl font-mono text-xs font-bold border border-white/10 bg-te-darkpanel flex flex-col items-center justify-center transition" data-day="Wednesday">
          <span class="text-[10px] opacity-60">WED</span>
        </button>
        <button onclick="setDay('Thursday')" class="day-btn tactile-btn py-3 rounded-2xl font-mono text-xs font-bold border border-white/10 bg-te-darkpanel flex flex-col items-center justify-center transition" data-day="Thursday">
          <span class="text-[10px] opacity-60">THU</span>
        </button>
        <button onclick="setDay('Friday')" class="day-btn tactile-btn py-3 rounded-2xl font-mono text-xs font-bold border border-white/10 bg-te-darkpanel flex flex-col items-center justify-center transition" data-day="Friday">
          <span class="text-[10px] opacity-60">FRI</span>
        </button>
        <button onclick="setDay('Saturday')" class="day-btn tactile-btn py-3 rounded-2xl font-mono text-xs font-bold border border-white/10 bg-te-darkpanel flex flex-col items-center justify-center transition" data-day="Saturday">
          <span class="text-[10px] opacity-60">SAT</span>
        </button>
        <button onclick="setDay('Sunday')" class="day-btn tactile-btn py-3 rounded-2xl font-mono text-xs font-bold border border-white/10 bg-te-darkpanel flex flex-col items-center justify-center transition" data-day="Sunday">
          <span class="text-[10px] opacity-60">SUN</span>
        </button>
      </div>
    </section>

    <!-- MAIN CONTENT VIEW DISPLAY -->
    <section class="space-y-4">
      <div class="flex items-center justify-between px-1">
        <h2 id="viewing-day-heading" class="font-mono font-bold text-sm tracking-wider uppercase flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-te-orange"></span> TODAY'S SCHEDULE
        </h2>
      </div>

      <!-- Mess Menu View Container -->
      <div id="mess-view" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Dynamic JS insertion -->
      </div>

      <!-- Class Timetable View Container -->
      <div id="timetable-view" class="hidden space-y-3">
        <!-- Dynamic JS insertion -->
      </div>
    </section>

  </main>

  <script>
    // Exact Hostel Menu Dataset
    const WEEKLY_MENU = {
      Monday: {
        breakfast: "Dosa, Chutney",
        lunch: "Rice, Veg Fry, Pappu, Chutney, Papad, Curd",
        dinner: "Rice, Pulka / Chapati, Veg Curry (Chole/Rajma/Double Beans), Rasam, Curd"
      },
      Tuesday: {
        breakfast: "Poori, Aloo Curry",
        lunch: "Vegetable Biryani / Jeera Rice / Green Peas Pulao, Aloo Korma, Raitha",
        dinner: "Rice, Pulka / Chapati, Egg Curry, Veg Curry, Curd"
      },
      Wednesday: {
        breakfast: "Idly, Chutney, Sambar",
        lunch: "Rice, Sambar, Veg Fry, Curd",
        dinner: "Bagara Rice, Chicken Curry, Veg Curry, Curd"
      },
      Thursday: {
        breakfast: "Bonda / Mysore Bajji, Chutney",
        lunch: "Rice, Vegetable Curry, Veg Fry, Curd",
        dinner: "Rice, Pulka / Chapati, Veg Curry, Rasam, Curd"
      },
      Friday: {
        breakfast: "Chapati / Paratha, Aloo Curry",
        lunch: "Rice, Leaf Dal, Veg Fry, Curd",
        dinner: "Egg Fried Rice / Egg Noodles, Raitha"
      },
      Saturday: {
        breakfast: "Utappam, Chutney, Banana",
        lunch: "Coconut Rice / Lemon / Pulihora / Mango Rice, Dal Curry, Curd",
        dinner: "Sweet, Rice, Pulka / Chapathi, Veg Curry, Sambar, Curd"
      },
      Sunday: {
        breakfast: "Upma + Pongal, Chutney",
        lunch: "Chicken Dum Biryani / Paneer Biryani / Veg Biryani, Raitha",
        dinner: "Rice, Dal, Rasam, Curd"
      }
    };

    // Exact Class Timetable Dataset
    const CLASS_TIMETABLE = {
      Monday: [
        { period: 1, start: "09:00", end: "09:50", code: "CSC 302", subject: "Operating Systems", room: "S 416" },
        { period: 3, start: "11:00", end: "11:50", code: "CSC 301", subject: "Computer Networks", room: "S 611" },
        { period: 4, start: "12:00", end: "12:50", code: "CSC 301", subject: "Computer Networks", room: "S 611" },
        { period: 6, start: "14:00", end: "14:50", code: "CSC 309", subject: "Advanced Java Programming", room: "S 416" },
        { period: 7, start: "15:00", end: "15:50", code: "CSC 309", subject: "Advanced Java Programming", room: "S 416" }
      ],
      Tuesday: [
        { period: 1, start: "09:00", end: "09:50", code: "CSC 301", subject: "Computer Networks", room: "S 416" },
        { period: 2, start: "10:00", end: "10:50", code: "CSC 301", subject: "Computer Networks", room: "S 416" },
        { period: 3, start: "11:00", end: "11:50", code: "CSC 304", subject: "Machine Learning", room: "S 611" },
        { period: 4, start: "12:00", end: "12:50", code: "CSC 304", subject: "Machine Learning", room: "S 611" },
        { period: 6, start: "14:00", end: "14:50", code: "CSC 302", subject: "Operating Systems", room: "S 416" },
        { period: 7, start: "15:00", end: "15:50", code: "CSC 302", subject: "Operating Systems", room: "S 416" }
      ],
      Wednesday: [
        { period: 1, start: "09:00", end: "09:50", code: "CSC 304", subject: "Machine Learning", room: "S 416" },
        { period: 2, start: "10:00", end: "10:50", code: "CSC 304", subject: "Machine Learning", room: "S 416" },
        { period: 3, start: "11:00", end: "11:50", code: "CSC 309", subject: "Advanced Java Programming", room: "S 709" },
        { period: 4, start: "12:00", end: "12:50", code: "CSC 309", subject: "Advanced Java Programming", room: "S 709" },
        { period: 6, start: "14:00", end: "14:50", code: "CSC 301", subject: "Computer Networks", room: "S 416" }
      ],
      Thursday: [
        { period: 3, start: "11:00", end: "11:50", code: "CSC 302", subject: "Operating Systems", room: "S 805" },
        { period: 4, start: "12:00", end: "12:50", code: "CSC 302", subject: "Operating Systems", room: "S 805" },
        { period: 6, start: "14:00", end: "14:50", code: "CSC 309", subject: "Advanced Java Programming", room: "S 416" },
        { period: 7, start: "15:00", end: "15:50", code: "SEC 302", subject: "Generative AI with Agentic AI", room: "S 416" },
        { period: 8, start: "16:00", end: "17:30", code: "SEC 302", subject: "Generative AI with Agentic AI", room: "S 416" }
      ],
      Friday: [
        { period: 2, start: "10:00", end: "10:50", code: "CSC 304", subject: "Machine Learning", room: "S 416" },
        { period: 7, start: "15:00", end: "15:50", code: "SEC 302", subject: "Generative AI with Agentic AI", room: "S 416" },
        { period: 8, start: "16:00", end: "17:30", code: "SEC 302", subject: "Generative AI with Agentic AI", room: "S 416" }
      ],
      Saturday: [],
      Sunday: []
    };

    const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    let currentSelectedDay = "";
    let activeView = "mess"; // "mess" or "timetable"

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playTactileClick() {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(750, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
      } catch (e) {}
    }

    // Initialize Page
    window.addEventListener('DOMContentLoaded', () => {
      selectToday(true);
      lucide.createIcons();
    });

    function getTodayName() {
      const dayIndex = new Date().getDay();
      return DAYS[dayIndex];
    }

    function switchView(view) {
      playTactileClick();
      activeView = view;

      const messBtn = document.getElementById('tab-mess');
      const timetableBtn = document.getElementById('tab-timetable');
      const messView = document.getElementById('mess-view');
      const timetableView = document.getElementById('timetable-view');

      if (view === 'mess') {
        messBtn.className = "tactile-btn py-2.5 rounded-xl font-mono text-xs font-bold transition flex items-center justify-center gap-2 bg-te-orange text-white shadow-md";
        timetableBtn.className = "tactile-btn py-2.5 rounded-xl font-mono text-xs font-bold transition flex items-center justify-center gap-2 text-te-gray hover:text-white";
        messView.classList.remove('hidden');
        timetableView.classList.add('hidden');
      } else {
        timetableBtn.className = "tactile-btn py-2.5 rounded-xl font-mono text-xs font-bold transition flex items-center justify-center gap-2 bg-te-orange text-white shadow-md";
        messBtn.className = "tactile-btn py-2.5 rounded-xl font-mono text-xs font-bold transition flex items-center justify-center gap-2 text-te-gray hover:text-white";
        timetableView.classList.remove('hidden');
        messView.classList.add('hidden');
      }

      setDay(currentSelectedDay, true);
    }

    function selectToday(shouldScroll = false) {
      const today = getTodayName();
      setDay(today, shouldScroll);
    }

    function setDay(day, autoScroll = false) {
      playTactileClick();
      currentSelectedDay = day;
      const todayName = getTodayName();

      // Update Day Buttons UI
      document.querySelectorAll('.day-btn').forEach(btn => {
        const btnDay = btn.getAttribute('data-day');
        if (btnDay === day) {
          btn.className = "day-btn tactile-btn py-3 rounded-2xl font-mono text-xs font-bold border-2 border-te-orange bg-te-orange text-white flex flex-col items-center justify-center transition shadow-md";
        } else {
          btn.className = "day-btn tactile-btn py-3 rounded-2xl font-mono text-xs font-bold border border-white/10 bg-te-darkpanel text-te-lightText flex flex-col items-center justify-center transition hover:bg-white/5";
        }
      });

      // Update Section Heading
      const heading = document.getElementById('viewing-day-heading');
      const viewTitle = activeView === 'mess' ? "TODAY'S MENU" : "CLASS TIMETABLE";
      const viewTitleOther = activeView === 'mess' ? "MESS MENU" : "TIMETABLE";
      
      if (day === todayName) {
        heading.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-te-green animate-pulse"></span> ${viewTitle} (${day.toUpperCase()})`;
      } else {
        heading.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-te-orange"></span> ${viewTitleOther} FOR ${day.toUpperCase()}`;
      }

      if (activeView === 'mess') {
        renderMealCards(day, autoScroll);
      } else {
        renderTimetableCards(day, autoScroll);
      }
    }

    function renderMealCards(day, autoScroll = false) {
      const container = document.getElementById('mess-view');
      const menu = WEEKLY_MENU[day];
      if (!menu) return;

      const now = new Date();
      const currentHour = now.getHours();
      const isToday = day === getTodayName();

      // Service Windows
      const isBreakfastActive = isToday && (currentHour >= 6 && currentHour < 10);
      const isLunchActive = isToday && (currentHour >= 12 && currentHour < 14);
      const isDinnerActive = isToday && (currentHour >= 17 && currentHour < 21);

      let targetMealId = null;
      if (isToday) {
        if (isBreakfastActive || currentHour < 10) targetMealId = "card-breakfast";
        else if (isLunchActive || (currentHour >= 10 && currentHour < 14)) targetMealId = "card-lunch";
        else targetMealId = "card-dinner";
      }

      container.innerHTML = `
        <!-- BREAKFAST CARD -->
        <div id="card-breakfast" class="rounded-3xl bg-te-glassDark border ${isBreakfastActive ? 'border-2 border-te-orange shadow-lg' : 'border-white/10'} glass-effect p-5 shadow-te-card-dark flex flex-col justify-between space-y-4 relative overflow-hidden transition-all duration-300">
          ${isBreakfastActive ? `<div class="absolute top-0 right-0 bg-te-orange text-white text-[9px] font-mono font-bold px-3 py-1 rounded-bl-xl uppercase">ACTIVE NOW</div>` : ''}
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl text-xs font-mono font-bold bg-te-yellow/20 text-te-yellow border border-te-yellow/30">
                <i data-lucide="coffee" class="w-3.5 h-3.5"></i> BREAKFAST
              </span>
              <span class="font-mono text-[11px] text-te-gray font-bold">06:00 - 10:00</span>
            </div>
            <div class="pt-1">
              <h3 class="font-bold text-base tracking-tight leading-snug text-te-lightText">
                ${formatMenuItems(menu.breakfast)}
              </h3>
            </div>
          </div>
        </div>

        <!-- LUNCH CARD -->
        <div id="card-lunch" class="rounded-3xl bg-te-glassDark border ${isLunchActive ? 'border-2 border-te-orange shadow-lg' : 'border-white/10'} glass-effect p-5 shadow-te-card-dark flex flex-col justify-between space-y-4 relative overflow-hidden transition-all duration-300">
          ${isLunchActive ? `<div class="absolute top-0 right-0 bg-te-orange text-white text-[9px] font-mono font-bold px-3 py-1 rounded-bl-xl uppercase">ACTIVE NOW</div>` : ''}
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl text-xs font-mono font-bold bg-te-orange/20 text-te-orange border border-te-orange/30">
                <i data-lucide="sun" class="w-3.5 h-3.5"></i> LUNCH
              </span>
              <span class="font-mono text-[11px] text-te-gray font-bold">12:00 - 14:00</span>
            </div>
            <div class="pt-1">
              <h3 class="font-bold text-base tracking-tight leading-snug text-te-lightText">
                ${formatMenuItems(menu.lunch)}
              </h3>
            </div>
          </div>
        </div>

        <!-- DINNER CARD -->
        <div id="card-dinner" class="rounded-3xl bg-te-glassDark border ${isDinnerActive ? 'border-2 border-te-orange shadow-lg' : 'border-white/10'} glass-effect p-5 shadow-te-card-dark flex flex-col justify-between space-y-4 relative overflow-hidden transition-all duration-300">
          ${isDinnerActive ? `<div class="absolute top-0 right-0 bg-te-orange text-white text-[9px] font-mono font-bold px-3 py-1 rounded-bl-xl uppercase">ACTIVE NOW</div>` : ''}
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl text-xs font-mono font-bold bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
                <i data-lucide="moon" class="w-3.5 h-3.5"></i> DINNER
              </span>
              <span class="font-mono text-[11px] text-te-gray font-bold">17:00 - 21:00</span>
            </div>
            <div class="pt-1">
              <h3 class="font-bold text-base tracking-tight leading-snug text-te-lightText">
                ${formatMenuItems(menu.dinner)}
              </h3>
            </div>
          </div>
        </div>
      `;

      lucide.createIcons();

      if (autoScroll && targetMealId) {
        setTimeout(() => {
          const targetCard = document.getElementById(targetMealId);
          if (targetCard) targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
      }
    }

    function renderTimetableCards(day, autoScroll = false) {
      const container = document.getElementById('timetable-view');
      const classes = CLASS_TIMETABLE[day] || [];

      if (classes.length === 0) {
        container.innerHTML = `
          <div class="rounded-3xl bg-te-glassDark border border-white/10 p-8 text-center space-y-3">
            <div class="w-12 h-12 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center mx-auto text-te-gray">
              <i data-lucide="sparkles" class="w-6 h-6 text-te-orange"></i>
            </div>
            <h3 class="font-mono font-bold text-sm text-te-lightText">NO CLASSES SCHEDULED</h3>
            <p class="font-mono text-xs text-te-gray">Enjoy your day! No lectures listed for ${day.toUpperCase()}.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const now = new Date();
      const isToday = day === getTodayName();
      const currentMin = now.getHours() * 60 + now.getMinutes();

      let activeClassId = null;

      container.innerHTML = classes.map((cls, idx) => {
        const startMins = parseTimeToMins(cls.start);
        const endMins = parseTimeToMins(cls.end);
        const isActive = isToday && (currentMin >= startMins && currentMin <= endMins);

        if (isActive) activeClassId = `class-card-${idx}`;

        return `
          <div id="class-card-${idx}" class="rounded-3xl bg-te-glassDark border ${isActive ? 'border-2 border-te-orange shadow-lg' : 'border-white/10'} glass-effect p-4 sm:p-5 shadow-te-card-dark flex flex-col sm:flex-row sm:items-center justify-between gap-3 relative overflow-hidden transition-all duration-300">
            ${isActive ? `<div class="absolute top-0 right-0 bg-te-orange text-white text-[9px] font-mono font-bold px-3 py-1 rounded-bl-xl uppercase">ACTIVE CLASS</div>` : ''}
            
            <div class="space-y-1.5 flex-1">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-lg text-[11px] font-mono font-bold bg-te-orange/20 text-te-orange border border-te-orange/30">
                  PERIOD ${cls.period}
                </span>
                <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-lg text-[11px] font-mono font-bold bg-white/10 text-te-lightText border border-white/10">
                  <i data-lucide="map-pin" class="w-3 h-3 text-te-orange"></i> CLASSROOM ${cls.room}
                </span>
              </div>

              <h3 class="font-bold text-base sm:text-lg tracking-tight text-te-lightText flex items-center gap-2 pt-1">
                <span>${cls.subject}</span>
                <span class="font-mono text-xs text-te-gray font-normal">(${cls.code})</span>
              </h3>
            </div>

            <!-- Time Display Badge -->
            <div class="self-start sm:self-center font-mono text-xs sm:text-sm font-bold bg-black/40 px-3.5 py-2 rounded-2xl border border-white/10 flex items-center gap-2 text-te-yellow">
              <i data-lucide="clock" class="w-4 h-4 text-te-orange"></i>
              <span>${formatDisplayTime(cls.start)} - ${formatDisplayTime(cls.end)}</span>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();

      if (autoScroll) {
        setTimeout(() => {
          const target = activeClassId ? document.getElementById(activeClassId) : container.firstElementChild;
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
      }
    }

    // Helper: Parse 24h string "09:00" or "14:00" to total minutes
    function parseTimeToMins(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      return h * 60 + m;
    }

    // Helper: Format time to 12h AM/PM
    function formatDisplayTime(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      const ampm = h >= 12 ? 'PM' : 'AM';
      const formattedH = h % 12 || 12;
      return `${String(formattedH).padStart(2, '0')}:${String(m).padStart(2, '0')} ${ampm}`;
    }

    // Formats item list into clean tags
    function formatMenuItems(text) {
      const items = text.split(',');
      return items.map(item => `<span class="inline-block bg-white/10 px-2.5 py-1 rounded-xl my-0.5 mr-1 text-xs sm:text-sm font-medium border border-white/5">${item.trim()}</span>`).join('');
    }
  </script>
</body>
</html>
