<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tools</title>
<style>
  *,*::before,*::after{ box-sizing:border-box; }

  :root{
    --bg:#e9e9e4;
    --panel:#f4f4ef;
    --panel-hi:#fbfbf7;
    --ink:#16160f;
    --line:#c9c9c1;
    --muted:#6f6f66;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  html{ -webkit-text-size-adjust:100%; }

  body{
    margin:0;
    min-height:100vh;
    padding-bottom:90px;
    color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    background-color:var(--bg);
    background-image:radial-gradient(#d4d4cc 1px, transparent 1px);
    background-size:14px 14px;
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:12px 20px;
    background:rgba(233,233,228,.82);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .logo{
    display:grid;
    grid-template-columns:repeat(2,6px);
    grid-template-rows:repeat(2,6px);
    gap:2px;
  }
  .logo i{ display:block; background:var(--ink); border-radius:1px; }
  .logo i:nth-child(2){ background:#ff4b00; }
  .brand-name{
    font:700 11.5px/1 var(--mono);
    letter-spacing:.22em;
  }
  .topmeta{
    display:flex;
    align-items:center;
    gap:9px;
    font:600 10px/1 var(--mono);
    letter-spacing:.16em;
    color:var(--muted);
  }
  .topmeta .sep{ opacity:.5; }
  .led{
    width:6px; height:6px; border-radius:50%;
    background:#12a150;
    box-shadow:0 0 0 2px rgba(18,161,80,.15);
    animation:blink 2.6s infinite;
  }
  @keyframes blink{
    0%,88%,100%{ opacity:1; }
    93%{ opacity:.2; }
  }

  /* ---------- PAGE HEAD ---------- */
  .page-head{
    max-width:1180px;
    margin:0 auto;
    padding:54px 20px 30px;
  }
  .page-head h1{
    margin:0;
    font-size:clamp(32px,6.4vw,58px);
    line-height:.94;
    letter-spacing:-.035em;
    font-weight:800;
  }
  .page-head p{
    margin:14px 0 0;
    max-width:46ch;
    font-size:13px;
    line-height:1.6;
    color:var(--muted);
  }

  /* ---------- SECTION ---------- */
  .section{
    max-width:1180px;
    margin:0 auto;
    padding:6px 20px 30px;
    opacity:0;
  }
  .section.in{
    opacity:1;
    animation:secIn .55s cubic-bezier(.22,1,.36,1) backwards;
  }
  @keyframes secIn{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- GRID ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(252px,1fr));
    gap:14px;
  }

  /* ---------- CARD ---------- */
  .card{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    opacity:0;
    transition:
      transform .34s cubic-bezier(.22,1,.36,1),
      box-shadow .34s ease,
      border-color .34s ease,
      background .34s ease;
  }
  .card.in{
    opacity:1;
    animation:cardIn .5s cubic-bezier(.22,1,.36,1) backwards;
    animation-delay:calc(var(--i) * 80ms);
  }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* accent hairline on hover */
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:2px;
    background:var(--accent);
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .42s cubic-bezier(.22,1,.36,1);
  }

  .card.in:hover{
    transform:translateY(-5px);
    border-color:var(--ink);
    background:var(--panel-hi);
    box-shadow:5px 6px 0 0 var(--accent);
  }
  .card.in:hover::before{ transform:scaleX(1); }

  .card.flash{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent);
  }

  .card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }

  .icon{
    width:42px; height:42px;
    flex:none;
    display:grid; place-items:center;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--panel-hi);
    color:var(--ink);
    transition:
      background .3s ease,
      color .3s ease,
      border-color .3s ease,
      transform .45s cubic-bezier(.22,1,.36,1);
  }
  .icon svg{ width:22px; height:22px; display:block; }
  .card.in:hover .icon{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    transform:rotate(-8deg) scale(1.07);
  }

  .idx{
    font:600 10px/1 var(--mono);
    letter-spacing:.16em;
    color:var(--muted);
    padding-top:4px;
  }

  .name{
    margin:0;
    font-size:16px;
    font-weight:700;
    letter-spacing:-.012em;
    text-transform:uppercase;
    line-height:1.15;
  }

  .desc{
    margin:0;
    flex:1;
    font-size:12.5px;
    line-height:1.55;
    color:var(--muted);
  }

  .card-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:4px;
  }

  /* ---------- VISIT LINK (was button) ---------- */
  .visit{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:9px 14px;
    border:1px solid var(--ink);
    border-radius:8px;
    background:transparent;
    color:var(--ink);
    font-family:var(--mono);
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.16em;
    text-transform:uppercase;
    text-decoration:none;
    cursor:pointer;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    transition:color .28s ease, transform .12s ease;
  }
  .visit::before{
    content:"";
    position:absolute;
    inset:0;
    background:var(--ink);
    transform:translateY(101%);
    transition:transform .32s cubic-bezier(.22,1,.36,1);
  }
  .visit:hover::before,
  .visit:focus-visible::before{ transform:translateY(0); }
  .visit:hover,
  .visit:focus-visible{ color:var(--panel-hi); }
  .visit:active{ transform:translateY(1px); }
  .visit:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .visit span,
  .visit svg{ position:relative; z-index:1; }
  .visit svg{
    width:12px; height:12px;
    transition:transform .3s cubic-bezier(.22,1,.36,1);
  }
  .visit:hover svg{ transform:translateX(3px); }

  /* ---------- SPEAKER HOLES ---------- */
  .holes{
    display:grid;
    grid-template-columns:repeat(3,4px);
    gap:3px;
  }
  .holes i{
    width:4px; height:4px;
    border-radius:50%;
    background:var(--line);
    transition:background .3s ease;
  }
  .card.in:hover .holes i{ background:var(--accent); }

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:26px;
    transform:translate(-50%,20px);
    z-index:100;
    padding:12px 18px;
    border-radius:8px;
    background:var(--ink);
    color:var(--panel-hi);
    font:600 10.5px/1 var(--mono);
    letter-spacing:.18em;
    text-transform:uppercase;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s cubic-bezier(.22,1,.36,1);
    white-space:nowrap;
  }
  .toast.show{
    opacity:1;
    transform:translate(-50%,0);
  }

  /* ---------- MOTION PREFERENCES ---------- */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-delay:0ms !important;
      transition-duration:.001ms !important;
    }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="brand-name">FIELD&nbsp;INDEX</span>
  </div>
  <div class="topmeta">
    <span class="led" aria-hidden="true"></span>
    <span>09 UNITS</span>
    <span class="sep">/</span>
    <span>REV.02</span>
  </div>
</header>

<main>
  <div class="page-head">
    <h1>tools<br>by Arrsh.</h1>
   
  </div>
  <div id="app"></div>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
  /* ---------- ICON LIBRARY (stroke based) ---------- */
  const ICONS = {
    knob:   `<circle cx="12" cy="12" r="7.5"/><path d="M12 12V6.5"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/>`,
    fader:  `<path d="M7 3v18"/><path d="M17 3v18"/><rect x="3.5" y="6.5" width="7" height="3.4" rx="1.2"/><rect x="13.5" y="13.5" width="7" height="3.4" rx="1.2"/>`,
    grid:   `<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>`,
    speaker:`<rect x="5" y="2.5" width="14" height="19" rx="2.4"/><circle cx="12" cy="15" r="3.4"/><circle cx="12" cy="7.2" r="1.2"/>`,
    wave:   `<path d="M2 12h3l2.4-7 3 14 3-10.5 2.4 5.5 2-2H22"/>`,
    cassette:`<rect x="2" y="5" width="20" height="14" rx="2.4"/><circle cx="8.4" cy="12" r="2.4"/><circle cx="15.6" cy="12" r="2.4"/><path d="M10.4 16.6h3.2"/>`,
    battery:`<rect x="2" y="7" width="17" height="10" rx="2.4"/><path d="M22 10.5v3"/><rect x="5" y="10" width="4" height="4" rx=".7"/><rect x="10.6" y="10" width="4" height="4" rx=".7"/>`,
    antenna:`<path d="M12 20.5V9"/><path d="M8.5 20.5h7"/><path d="M8 11.6a5.6 5.6 0 0 1 8 0"/><path d="M10 14.6a2.9 2.9 0 0 1 4 0"/>`,
    chip:   `<rect x="6" y="6" width="12" height="12" rx="2.2"/><path d="M10 3v3M14 3v3M10 18v3M14 18v3M3 10h3M3 14h3M18 10h3M18 14h3"/>`
  };

  const svg = (name) =>
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ""}</svg>`;

  /* ---------- DATA : 3 SECTIONS × 3 CARDS ---------- */
  /* Each card now carries a `url` that the Visit link points to. */
  const DATA = [
    {
      id: "X",
      accent: "#ff4b00",
      cards: [
        { name: "yt dlp",  desc: "youtube video download with commands .", icon: "knob",    url: "https://arshhx000.github.io/Arshad/yt_dlp_1080p_command_generator.html" },
        { name: "IEEE DOCS",   desc: "IEEE confrenece Editor",       icon: "fader",   url: "https://arshhx000.github.io/Arshad/ieee.html" },
        { name: "Grid Pad",     desc: "Sixteen velocity-sensitive pads, each with its own LED ring.",        icon: "grid",    url: "https://example.com/x/grid-pad" }
      ]
    },
   

  /* ---------- RENDER ---------- */
  const app = document.getElementById("app");
  const toast = document.getElementById("toast");
  let toastTimer;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1700);
  }

  DATA.forEach((section, si) => {
    const el = document.createElement("section");
    el.className = "section";
    el.style.setProperty("--accent", section.accent);
    el.innerHTML = `<div class="grid"></div>`;

    const grid = el.querySelector(".grid");

    section.cards.forEach((card, ci) => {
      const article = document.createElement("article");
      article.className = "card";
      article.style.setProperty("--i", ci);

      article.innerHTML = `
        <div class="card-top">
          <div class="icon">${svg(card.icon)}</div>
          <div class="idx">${String(si * 3 + ci + 1).padStart(2, "0")}</div>
        </div>
        <h3 class="name">${card.name}</h3>
        <p class="desc">${card.desc}</p>
        <div class="card-foot">
          <a class="visit" href="${card.url}" target="_blank" rel="noopener noreferrer"
             aria-label="Visit ${card.name}">
            <span>Visit</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h13"/><path d="M12.5 6l6 6-6 6"/>
            </svg>
          </a>
          <div class="holes" aria-hidden="true">${"<i></i>".repeat(6)}</div>
        </div>
      `;

      grid.appendChild(article);

      /* feedback on link click */
      article.querySelector(".visit").addEventListener("click", () => {
        showToast(`Open → ${card.name}`);
        article.classList.add("flash");
        setTimeout(() => article.classList.remove("flash"), 400);
      });
    });

    app.appendChild(el);
  });

  /* ---------- SCROLL REVEAL ---------- */
  const io = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("in");
          io.unobserve(entry.target);
        }
      });
    },
    { threshold: 0.15, rootMargin: "0px 0px -40px 0px" }
  );

  document.querySelectorAll(".section, .card").forEach((el) => io.observe(el));

  /* Safety: reveal anything still hidden after load (e.g. above the fold) */
  window.addEventListener("load", () => {
    document.querySelectorAll(".section, .card").forEach((el) => {
      const r = el.getBoundingClientRect();
      if (r.top < window.innerHeight) el.classList.add("in");
    });
  });
</script>
</body>
</html>
